<!DOCTYPE html>
<html>
<head>
  <title>Chat Application</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f8ff; /* light blue background */
      color: #333;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #0066cc;
      text-align: center;
    }

    #messages {
      background: #ffffff;
      border: 2px solid #0066cc;
      border-radius: 8px;
      padding: 10px;
      height: 300px;
      overflow-y: auto;
      margin-bottom: 15px;
    }

    #messages p {
      background: #e6f0ff;
      padding: 5px 10px;
      border-radius: 5px;
      margin: 5px 0;
      color: #003366;
      font-weight: bold;
    }

    form {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    #input {
      flex: 1;
      padding: 10px;
      border: 2px solid #0066cc;
      border-radius: 6px;
    }

    button {
      background-color: #0066cc;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #004d99;
    }
  </style>
</head>
<body>
  <h1>Chat Room</h1>
  <div id="messages"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Type hi..." />
    <button type="submit">Send</button>
  </form>

  <script src="/chat.js"></script>
  <script>
    window.messages = document.getElementById("messages");
    window.form = document.getElementById("form");
    window.input = document.getElementById("input");
  </script>
</body>
</html>
