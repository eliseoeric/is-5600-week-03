<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nithin's Chat App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #1e293b;
      background: linear-gradient(135deg, #dbeafe, #ede9fe, #fce7f3);
    }

    .chat-container {
      width: min(900px, 100%);
      height: 100vh;
      height: 100dvh;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.65);
      box-shadow: 0 0 40px rgba(62, 76, 130, 0.12);
    }

    .chat-header {
      padding: 24px;
      color: white;
      background: linear-gradient(120deg, #2563eb, #7c3aed);
    }

    .chat-header h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .chat-header p {
      margin: 0;
      color: #e0e7ff;
      font-size: 14px;
    }

    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 24px;
      overflow-wrap: anywhere;
    }

    #messages h4 {
      margin: 0 0 20px;
      color: #64748b;
      font-size: 14px;
    }

    #messages p {
      width: fit-content;
      max-width: 85%;
      margin: 12px 0;
      padding: 14px 18px;
      line-height: 1.5;
      white-space: pre-wrap;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px 16px 16px 4px;
      box-shadow: 0 4px 12px rgba(30, 64, 175, 0.07);
    }

    #form {
      display: flex;
      gap: 12px;
      padding: 20px;
      background: #f8faff;
      border-top: 1px solid #dbe3f0;
    }

    #input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      font: inherit;
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
    }

    #input:focus {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }

    button {
      padding: 14px 24px;
      font: inherit;
      font-weight: bold;
      color: white;
      background: #2563eb;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:focus-visible {
      outline: 3px solid #7c3aed;
      outline-offset: 3px;
    }

    @media (max-width: 480px) {
      .chat-header {
        padding: 20px;
      }

      .chat-header h1 {
        font-size: 22px;
      }

      #messages {
        padding: 16px;
      }

      #form {
        padding: 12px;
        gap: 8px;
      }

      button {
        padding: 12px 16px;
      }
    }
  </style>

  <script src="/chat.js" defer></script>
</head>

<body>
  <main class="chat-container">
    <header class="chat-header">
      <h1>Nithin's Chat App</h1>
      <p>Send a message and chat across connected tabs.</p>
    </header>

    <div id="messages" aria-live="polite">
      <h4>Chat Messages</h4>
    </div>

    <form id="form">
      <input
        id="input"
        name="message"
        type="text"
        placeholder="Type your message..."
        aria-label="Your message"
        autocomplete="off"
        required
      >
      <button type="submit">Send</button>
    </form>
  </main>
</body>
</html>
