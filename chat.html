<!DOCTYPE html>
<html lang="en">
<head>
  <title>Lavender Sky Chat</title>
  <style>
    body {
      font-family: 'Avenir Next', sans-serif;
      background: linear-gradient(135deg, #a18cd1, #fbc2eb);
      height: 100vh; margin: 0;
      display: flex; justify-content: center; align-items: center;
    }
    .chat-box {
      background: #fff; border-radius: 12px; width: 400px; height: 85vh;
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }
    .chat-header { background:#a18cd1; color:#fff; text-align:center; padding:10px; font-weight:600; }
    #messages { flex:1; padding:10px; background:#faf6ff; overflow-y:auto; }
    form { display:flex; padding:8px; background:#fff; border-top:1px solid #ddd; }
    input { flex:1; padding:8px; border:1px solid #ccc; border-radius:8px; }
    button { margin-left:5px; padding:8px 12px; border:none; border-radius:8px;
             background:linear-gradient(90deg,#fbc2eb,#a18cd1); color:#fff; cursor:pointer; }
  </style>
</head>
<body>
  <div class="chat-box">
    <div class="chat-header">Chat</div>
    <div id="messages"></div>
    <form id="form">
      <input id="input" type="text" placeholder="Type a message..." />
      <button type="submit">Send</button>
    </form>
  </div>
  <script src="/chat.js"></script>
</body>
</html>
