<!DOCTYPE html>
<html lang="en">
  <!-- Title of the web page -->
  <title>Chat App</title>

  <!-- Link to external stylesheet for styling (tachyons is a CSS framework) -->
  <link rel="stylesheet" href="tachyons.min.css">

  <!-- Link to custom styling (chat.css) -->
  <link rel="stylesheet" href="chat.css">

  <body>
    <!-- Section where chat messages will be displayed -->
    <div id="messages">
      <!-- Heading for the chat messages section -->
      <h4>Chat Messages</h4>
    </div>

    <!-- Form for submitting messages -->
    <form id="form">
      <!-- Input field for entering a message -->
      <input
        id="input"
        type="text"
        placeholder="Your message..."
      >
    </form>

    <!-- Link to external JavaScript file to handle the chat functionality -->
    <script src='chat.js'></script>
  </body>
</html>
